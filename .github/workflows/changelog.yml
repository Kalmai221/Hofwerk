name: Changelog

# Keeps the changelog in the shape the release notes, the website and the app's "What's new" read. It runs only when the changelog
# (or the script that reads it) changes.
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - installer/changelog-section.ps1
      - .github/workflows/changelog.yml
  pull_request:
    paths:
      - CHANGELOG.md
      - installer/changelog-section.ps1
      - .github/workflows/changelog.yml
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: CHANGELOG.md has a place for unreleased changes and every version has notes
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          if ($text -notmatch '(?m)^##\s+\[Unreleased\]') { throw 'CHANGELOG.md needs a "## [Unreleased]" section for changes that are not released yet.' }
          foreach ($m in [regex]::Matches($text, '(?m)^##\s+\[([^\]]+)\]') | Where-Object { $_.Groups[1].Value -ne 'Unreleased' }) {
            ./installer/changelog-section.ps1 -Version $m.Groups[1].Value -Output "$env:RUNNER_TEMP/notes.md" -Strict
          }
