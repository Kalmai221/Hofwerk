name: CI

# The unit tests run when something they depend on changes, and not for a change to the README, the roadmap, the website, the
# pictures or the other documents. CHANGELOG.md counts: it is built into the app and the tests read it. Presets count (their .json and
# .txt files are built into the app), their README does not.
# A newer push to the same branch or pull request cancels the run that is still going.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - Presets/**
      - '!Presets/**/*.md'
      - CHANGELOG.md
      - Hofwerk.slnx
      - test.ps1
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - Presets/**
      - '!Presets/**/*.md'
      - CHANGELOG.md
      - Hofwerk.slnx
      - test.ps1
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Every language has all the texts
        if: matrix.os == 'ubuntu-24.04'
        run: python3 src/Hofwerk.Installer.Engine/Languages/extract-texts.py --check
      - name: Unit tests (the summary is on the job page)
        shell: pwsh
        run: ./test.ps1 -Configuration Release -Slowest 5
