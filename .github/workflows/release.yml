name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release text is the part of CHANGELOG.md written for this version, plus a guide to the files. Checked first, so a tag with no
  # notes fails in seconds and not after the builds. The app shows the same text under "What's new".
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGELOG.md
            installer/changelog-section.ps1
            .github/release-footer.md
          sparse-checkout-cone-mode: false
      - name: Write the release notes from the changelog
        shell: pwsh
        run: |
          # A tag must have notes written for it (-Strict); a manual run of the workflow only gets a fallback text.
          $options = @{}
          if ('${{ github.ref_type }}' -eq 'tag') { $options.Strict = $true }
          ./installer/changelog-section.ps1 -Version '${{ github.ref_name }}' -Output release-notes.md -Footer .github/release-footer.md @options
          Get-Content release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md

  test:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        shell: pwsh
        run: ./test.ps1 -Configuration Release

  # One file per platform: the installer with the app attached inside it. See installer/build-installer.ps1.
  # The build itself already starts the published app, visits every page and saves a file (installer/check-app.ps1).
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build the installer
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^[vV]', ''
          if ($v -notmatch '^\d') { $v = '0.0.0-dev' }
          ./installer/build-installer.ps1 -Rid win-x64 -Version $v -Tag '${{ github.ref_name }}'

      # The finished installer is tested the way a user meets it. These use Windows PowerShell 5.1, as they were written for.
      - name: Test the installer (silent install, launch, update, uninstall)
        shell: powershell
        run: ./installer/test-installer.ps1 -Setup (Get-ChildItem dist/Hofwerk-Setup-*.exe | Select-Object -First 1).FullName
      - name: Test the installer window (every step, answering the OMSI question both ways)
        shell: powershell
        run: ./installer/check-setup-ui.ps1 -Setup (Get-ChildItem dist/Hofwerk-Setup-*.exe | Select-Object -First 1).FullName

      - name: Test the online installer (downloads the app, same checks)
        shell: powershell
        run: ./installer/test-web-installer.ps1 -WebSetup (Get-ChildItem dist/Hofwerk-WebSetup-*.exe | Select-Object -First 1).FullName -Pack (Get-ChildItem dist/*.hwpack | Select-Object -First 1).FullName -AppFolder publish/win-x64/app

      - name: Test the error dialog (restart, try a different version, report a bug)
        shell: powershell
        run: ./installer/test-error-dialog.ps1 -Setup (Get-ChildItem dist/Hofwerk-Setup-*.exe | Select-Object -First 1).FullName

      - name: Test switching between the two Windows versions (standard and compatibility)
        shell: powershell
        run: ./installer/test-compat.ps1 -Setup (Get-ChildItem dist/Hofwerk-Setup-*.exe | Select-Object -First 1).FullName -CompatFolder publish/win-x64/compat

      - uses: actions/upload-artifact@v6
        with:
          name: installer-windows
          path: dist/*

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build the installer
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^[vV]', ''
          if ($v -notmatch '^\d') { $v = '0.0.0-dev' }
          ./installer/build-installer.ps1 -Rid linux-x64 -Version $v -Tag '${{ github.ref_name }}'

      # Installs and removes it on a real Linux system: files, menu entry, icon, settings, uninstaller.
      - name: Test the installer (silent install, update, uninstall)
        shell: pwsh
        run: ./installer/test-installer-linux.ps1 -Archive (Get-ChildItem dist/Hofwerk-Setup-*.tar.gz | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v6
        with:
          name: installer-linux
          path: dist/*

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes/release-notes.md
          # v1.2.3 is a normal release; anything with a suffix (V0.1-dev1, v1.0.0.0-rc2, ...) is marked as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
