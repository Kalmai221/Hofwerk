name: Website

# Builds the website (website/build.py) and publishes it with GitHub Pages. It runs
#  - when the site, the changelog, the roadmap, the README, the presets guide or the picture change,
#  - after a release was published, so the Download page has the new installers,
#  - and by hand from the Actions tab.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - CHANGELOG.md
      - ROADMAP.md
      - README.md
      - Presets/README.md
      - docs/**
      - .github/workflows/website.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build the site (copies the installers of the newest releases onto it)
        run: python website/build.py --out _site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
