      <stop offset="0" stop-color="#22B0FF"/>
      <stop offset="1" stop-color="#0041AD"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <rect x="112" y="352" width="92" height="92" rx="26" fill="#0a2765"/>
  <rect x="308" y="352" width="92" height="92" rx="26" fill="#0a2765"/>

  <rect x="82" y="62" width="348" height="332" rx="66" fill="#ffffff"/>

  <rect x="118" y="98" width="276" height="96" rx="20" fill="#0b2d70"/>
  <rect x="142" y="124" width="228" height="44" rx="12" fill="#ffb300"/>

  <rect x="118" y="214" width="276" height="100" rx="24" fill="#2a74e6"/>

  <circle cx="170" cy="350" r="26" fill="#ffc83d"/>
  <circle cx="342" cy="350" r="26" fill="#ffc83d"/>
</svg>
