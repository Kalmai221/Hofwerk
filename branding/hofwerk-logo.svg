<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hofwerk">
  <title>Hofwerk</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B0FF"/>
      <stop offset="1" stop-color="#0041AD"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.22" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b8ff"/>
      <stop offset="1" stop-color="#1757c9"/>
    </linearGradient>
    <clipPath id="windscreen"><rect x="132" y="214" width="248" height="104" rx="22"/></clipPath>
  </defs>

  <!-- the tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- shadow and wheels -->
  <ellipse cx="256" cy="440" rx="156" ry="13" fill="#001650" opacity="0.30"/>
  <rect x="128" y="366" width="68" height="68" rx="20" fill="#0a2765"/>
  <rect x="316" y="366" width="68" height="68" rx="20" fill="#0a2765"/>

  <!-- the bus -->
  <rect x="98" y="82" width="316" height="308" rx="60" fill="url(#body)"/>

  <!-- destination sign: a route number and where the bus is going -->
  <rect x="130" y="114" width="252" height="78" rx="18" fill="#0b2d70"/>
  <rect x="150" y="134" width="54" height="38" rx="9" fill="#ffb300"/>
  <rect x="218" y="134" width="146" height="13" rx="6.5" fill="#ffb300"/>
  <rect x="218" y="159" width="98" height="13" rx="6.5" fill="#ffb300" opacity="0.72"/>

  <!-- windscreen -->
  <rect x="132" y="214" width="248" height="104" rx="22" fill="url(#glass)"/>
  <path d="M128 322 L216 210 H268 L180 322 Z" fill="#ffffff" opacity="0.2" clip-path="url(#windscreen)"/>

  <!-- lights and grille -->
  <circle cx="172" cy="353" r="22" fill="#ffc83d"/>
  <circle cx="340" cy="353" r="22" fill="#ffc83d"/>
  <circle cx="172" cy="353" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="4"/>
  <circle cx="340" cy="353" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="4"/>
  <rect x="226" y="343" width="60" height="12" rx="6" fill="#9ab8e6"/>
</svg>
